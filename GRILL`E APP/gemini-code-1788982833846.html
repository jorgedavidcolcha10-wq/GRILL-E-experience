<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRILL'E - Panel de Administración</title>
  <style>
    :root {
      --primary: #f1c40f; /* Amarillo */
      --dark: #121212;
      --card-bg: #1e1e1e;
      --green: #27ae60;
      --gray: #7f8c8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--dark);
      color: #fff;
      display: flex;
      min-height: 100vh;
    }

    aside {
      width: 240px;
      background: #000;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-links li a {
      color: #aaa;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 8px;
      display: block;
      font-weight: bold;
    }

    .nav-links li a.active, .nav-links li a:hover {
      background: var(--primary);
      color: #000;
    }

    main {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
    }

    .metric-card h3 {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 5px;
    }

    .metric-card .number {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #333;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: bold;
      color: var(--primary);
    }

    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .status-pendiente { background: #e74c3c; color: white; }
    .status-parrilla { background: #f39c12; color: black; }
    .status-camino { background: #3498db; color: white; }
    .status-entregado { background: #2ecc71; color: white; }

    .btn-add {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #333;
      color: #fff;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="brand">GRILL'E ADMIN</div>
    <ul class="nav-links">
      <li><a href="#" class="active">📦 Pedidos</a></li>
      <li><a href="#">🥩 Gestor de Menú</a></li>
    </ul>
  </aside>

  <main>
    <header>
      <h1>Panel de Control de la Parrilla</h1>
      <button class="btn-add" onclick="simularNuevoPedido()">⚡ Simular Nuevo Pedido</button>
    </header>

    <section class="metrics-grid">
      <div class="metric-card">
        <h3>VENTAS DEL DÍA</h3>
        <div class="number">$152.00</div>
      </div>
      <div class="metric-card">
        <h3>PEDIDOS ACTIVOS</h3>
        <div class="number" id="active-count">1</div>
      </div>
    </section>

    <h2>Pedidos Recibidos (En Vivo)</h2>
    <div class="orders-grid" id="orders-container" style="margin-top:15px;"></div>
  </main>

  <script>
    let orders = [
      {
        id: "#1001",
        customer: "Carlos Mendoza",
        items: "• Corte Tomahawk (800g) (Medio)",
        total: 28.50,
        status: "parrilla"
      }
    ];

    function renderOrders() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '';
      orders.forEach((o, index) => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-header">
            <span class="order-id">${o.id} - ${o.customer}</span>
            <span class="status-badge status-${o.status}">${o.status.toUpperCase()}</span>
          </div>
          <p style="font-size:0.9rem; margin-bottom:10px;">${o.items}</p>
          <div style="font-weight:bold; color:var(--primary); font-size:1.1rem;">Total: $${o.total.toFixed(2)}</div>
          <button class="btn-action" onclick="avanzarEstado(${index})">Avanzar Estado</button>
        `;
        container.appendChild(card);
      });
    }

    function avanzarEstado(index) {
      const estados = ['pendiente', 'parrilla', 'camino', 'entregado'];
      let actual = estados.indexOf(orders[index].status);
      if (actual < estados.length - 1) {
        orders[index].status = estados[actual + 1];
        renderOrders();
      }
    }

    function simularNuevoPedido() {
      orders.unshift({
        id: `#${Math.floor(1000 + Math.random() * 9000)}`,
        customer: "Nuevo Cliente",
        items: "• Costillas BBQ + Cerveza",
        total: 21.00,
        status: "pendiente"
      });
      renderOrders();
    }

    renderOrders();
  </script>
</body>
</html>
