<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalizar pedido | GRILL'E</title><link rel="stylesheet" href="/css/styles.css">
</head><body>
<header class="header"><a class="brand" href="/"><img src="/assets/logo.svg"></a><nav><a href="/carrito.html">← Carrito</a></nav></header>
<main class="section narrow">
<span class="eyebrow">PASO FINAL</span><h1>Finalizar pedido</h1>
<form id="checkoutForm" class="form">
<label>Nombre completo<input name="name" required></label>
<label>Teléfono<input name="phone" required></label>
<label>Correo electrónico<input name="email" type="email"></label>
<label>Modalidad<select name="type" id="type"><option value="delivery">Delivery</option><option value="pickup">Retiro</option><option value="local">Consumo en local</option></select></label>
<div id="addressFields"><label>Dirección<input name="address"></label><label>Referencia<input name="reference"></label></div>
<label>Método de pago<select name="paymentMethod" id="paymentMethod"><option value="pagoplux">Tarjeta (PagoPlux)</option><option value="cash">Efectivo</option><option value="transfer">Transferencia</option></select></label>
<label>Observaciones<textarea name="notes" rows="3"></textarea></label>
<button class="btn" type="submit">Confirmar pedido</button>
</form>
<div id="result"></div>
</main>
<script src="/js/app.js"></script><script src="/js/checkout.js"></script>
</body></html>
